<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border-radius:25px;
padding:25px;
box-shadow:0 15px 40px rgba(0,0,0,.35);
color:#fff;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.timer{
background:rgba(255,255,255,.15);
padding:8px 15px;
border-radius:30px;
font-weight:600;
}

.status{
color:#8fff9f;
font-size:14px;
}

.title{
text-align:center;
font-size:28px;
font-weight:700;
margin-bottom:10px;
}

.product{
text-align:center;
font-size:18px;
margin-bottom:8px;
}

.name{
text-align:center;
font-size:16px;
margin-bottom:5px;
}

.pan{
text-align:center;
font-size:14px;
opacity:.8;
margin-bottom:20px;
}

.amount{
text-align:center;
font-size:38px;
font-weight:700;
color:#00ff99;
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
}

.input-box{
display:flex;
gap:10px;
margin-bottom:20px;
}

.input-box input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-size:15px;
outline:none;
}

.copy{
border:none;
padding:12px 18px;
background:#00b894;
color:#fff;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.copy:hover{
background:#00a884;
}

.qr{
display:flex;
justify-content:center;
margin:20px 0;
}

.qr img{
width:220px;
background:#fff;
padding:10px;
border-radius:18px;
}
.apps{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.app{
background:rgba(255,255,255,.15);
padding:10px 18px;
border-radius:30px;
font-size:14px;
}

#utr{
width:100%;
padding:13px;
border:none;
outline:none;
border-radius:12px;
font-size:15px;
margin-bottom:15px;
}

.submit{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#00c853,#0091ea);
color:#fff;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.submit:hover{
opacity:.9;
}

#msg{
text-align:center;
margin-top:15px;
font-weight:600;
}
</style>
</head>

<body>

<div class="card">

<div class="header">
<div class="timer" id="timer">10:00</div>
<div class="status">Payment Active</div>
</div>

<div class="title">Secure Payment</div>

<div class="product">Product : Loan Repayment</div>

<div class="name">Name : Jugesh Prajapati</div>

<div class="pan">PAN : BJBPJ6043H</div>

<div class="amount">₹12,500</div>

<label>UPI ID</label>

<div class="input-box">
<input type="text" id="upi" value="pranshu.22@ptaxis" oninput="updateQR()">
<button class="copy" onclick="copyUPI()">Copy</button>
</div>

<div class="qr">
<img id="qrImage">
</div>

<div class="apps">
<div class="app">Paytm</div>
<div class="app">Google Pay</div>
<div class="app">PhonePe</div>
</div>

<input type="text" id="utr" placeholder="Enter 12 Digit UTR">

<button class="submit" onclick="submitUTR()">Submit Payment</button>

<div id="msg"></div>

</div>

<script>
let time = 600;
const timer = document.getElementById("timer");

setInterval(function () {
    if (time > 0) {
        time--;
        let min = Math.floor(time / 60);
        let sec = time % 60;
        timer.innerHTML = min + ":" + (sec < 10 ? "0" + sec : sec);
    } else {
        timer.innerHTML = "Expired";
    }
}, 1000);

function updateQR() {
    let upi = document.getElementById("upi").value.trim();

    document.getElementById("qrImage").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
        encodeURIComponent("upi://pay?pa=" + upi);
}

updateQR();

function copyUPI() {
    let upi = document.getElementById("upi");

    upi.select();
    upi.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(upi.value);

    alert("✅ UPI ID Copied");
}

function submitUTR() {

    let utr = document.getElementById("utr").value.trim();

    let msg = document.getElementById("msg");

    if (!/^[0-9]{12}$/.test(utr)) {

        msg.style.color = "#ff4d4d";

        msg.innerHTML = "❌ Invalid UTR Number";

        return;

    }

    msg.style.color = "#00ff99";

    msg.innerHTML = "✅ Payment Submitted Successfully";

}

</script>

</body>
</html>
