<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Payment</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#0f2027);
background-size:400% 400%;
animation:bg 8s infinite alternate;
}

@keyframes bg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

.card{
width:360px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
text-align:center;
}

h2{
color:#0a7cff;
margin-bottom:10px;
}

.timer{
font-size:22px;
color:red;
font-weight:bold;
margin:10px 0;
}

.info{
background:#f4f4f4;
padding:10px;
border-radius:8px;
margin:10px 0;
}

.upi{
display:flex;
margin-top:10px;
}

.upi input{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:5px 0 0 5px;
}

.upi button{
padding:10px 15px;
background:#0a7cff;
color:white;
border:none;
cursor:pointer;
border-radius:0 5px 5px 0;
}

.qr{
margin:20px 0;
}

.qr img{
width:180px;
height:180px;
border:1px solid #ddd;
}

input[type=text]{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
margin-top:10px;
}

.submit{
width:100%;
padding:12px;
margin-top:15px;
background:green;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>🔒 Secure Payment</h2>

<div class="timer" id="timer">
10:00
</div>

<div class="info">
<b>Product:</b> Premium Plan
<br><br>
<b>Amount:</b> ₹499
</div>

<div class="upi">
<input type="text" id="upi" value="yourupi@upi" readonly>
<button onclick="copyUPI()">Copy</button>
</div>

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=yourupi@upi" alt="QR">
</div>

<input type="text" maxlength="12" placeholder="Enter 12 Digit UTR">

<button class="submit">
Submit
</button>

</div>

<script>

function copyUPI(){
let upi=document.getElementById("upi");

navigator.clipboard.writeText(upi.value);

alert("UPI Copied");
}

let total=600;

let x=setInterval(function(){

let m=Math.floor(total/60);

let s=total%60;

document.getElementById("timer").innerHTML=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

total--;

if(total<0){
clearInterval(x);
document.getElementById("timer").innerHTML="Expired";
}

},1000);

</script>

</body>
</html>
