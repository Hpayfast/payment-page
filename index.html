<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Payment</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --glass: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.75);
      --shadow: 0 10px 40px rgba(0,0,0,0.35);
      --blue: #1e90ff;
      --red: #ff3b30;
      --bluberry: #5f4bff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background: linear-gradient(120deg, var(--bg1), var(--bg2), #0b1120);
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      z-index: -2;
      animation: float 10s ease-in-out infinite;
    }

    body::before {
      top: -80px;
      left: -80px;
      background: radial-gradient(circle, #00e5ff, transparent 65%);
    }

    body::after {
      bottom: -80px;
      right: -80px;
      background: radial-gradient(circle, #8b5cf6, transparent 65%);
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px) scale(1); }
      50% { transform: translateY(25px) translateX(15px) scale(1.08); }
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      animation: rise linear infinite;
    }

    @keyframes rise {
      from { transform: translateY(110vh) scale(0.6); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-20vh) scale(1.2); opacity: 0; }
    }

    .container {
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
    }

    .glass-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 40%, rgba(255,255,255,0.08));
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00e5ff, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,229,255,0.25);
      font-size: 28px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 4px;
      font-size: 14px;
    }

    .timer-box {
      margin: 18px 0 26px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .timer-label {
      font-weight: 700;
      color: #dbeafe;
    }

    .timer {
      font-size: 26px;
      font-weight: 900;
      color: #7dd3fc;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #e5e7eb;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      outline: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .upi-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .upi-row input {
      flex: 1;
    }

    .btn {
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 800;
      transition: 0.25s ease;
    }

    .copy-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      white-space: nowrap;
    }

    .copy-btn:hover {
      transform: translateY(-2px);
    }

    .qr-box {
      margin-top: 20px;
      text-align: center;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .qr-box img {
      width: 220px;
      max-width: 100%;
      border-radius: 16px;
      background: white;
      padding: 10px;
    }

    .payments {
      margin-top: 18px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
    }

    .paytm { color: #1e90ff; }
    .gpay { color: #ff3b30; }
    .phonepe { color: #5f4bff; }

    .utr-box {
      margin-top: 20px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      font-size: 16px;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      text-align: center;
    }

    @media (max-width: 640px) {
      .container { margin: 16px auto; padding: 12px; }
      .glass-card { padding: 20px; border-radius: 18px; }
      .title { font-size: 22px; }
      .timer { font-size: 22px; }
      .upi-row { flex-direction: column; align-items: stretch; }
      .copy-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="glass-card">
      <div class="header">
        <div class="logo">🔒</div>
        <div>
          <div class="title">Secure Payment</div>
          <div class="subtitle">Advanced encrypted payment interface</div>
        </div>
      </div>

      <div class="timer-box">
        <div class="timer-label">Offer expires in</div>
        <div class="timer" id="timer">10:00</div>
      </div>

      <div class="form-group">
        <label for="productName">Next Product Name</label>
        <input type="text" id="productName" placeholder="Enter product name" />
      </div>

      <div class="form-group">
        <label for="amount">Amount</label>
        <input type="text" id="amount" placeholder="Enter amount" />
      </div>

      <div class="form-group">
        <label for="upiId">UPI ID</label>
        <div class="upi-row">
          <input type="text" id="upiId" value="YOUR_UPI_ID_HERE" readonly />
          <button class="btn copy-btn" onclick="copyUPI()">Copy UPI</button>
        </div>
      </div>

      <div class="qr-box">
        <div style="margin-bottom: 12px; font-weight: 700;">Scan UPI QR Code</div>
        <img id="qrImage" src="" alt="UPI QR Code" />
      </div>

      <div class="payments">
        <span class="paytm">Paytm</span>
        <span class="gpay">Gpay</span>
        <span class="phonepe">PhonePe</span>
      </div>

      <div class="utr-box">
        <div class="form-group">
          <label for="utr">12 Digit UTR Submission</label>
          <input type="text" id="utr" placeholder="Enter 12 digit UTR number" maxlength="12" />
        </div>
        <button class="btn submit-btn" onclick="submitUTR()">Submit UTR</button>
      </div>

      <div class="note">Please verify payment details before submitting UTR.</div>
    </div>
  </div>

  <script>
    function copyUPI() {
      const upi = document.getElementById("upiId");
      navigator.clipboard.writeText(upi.value).then(() => {
        alert("UPI ID copied!");
      }).catch(() => {
        alert("Copy failed. Please copy manually.");
      });
    }

    function submitUTR() {
      const utr = document.getElementById("utr").value.trim();
      if (!/^\d{12}$/.test(utr)) {
        alert("Please enter a valid 12 digit UTR.");
        return;
      }
      alert("UTR submitted successfully: " + utr);
    }

    let totalSeconds = 10 * 60;
    const timerEl = document.getElementById("timer");

    function updateTimer() {
      const min = Math.floor(totalSeconds / 60);
      const sec = totalSeconds % 60;
      timerEl.textContent =
        String(min).padStart(2, "0") + ":" + String(sec).padStart(2, "0");

      if (totalSeconds > 0) {
        totalSeconds--;
      } else {
        timerEl.textContent = "00:00";
      }
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    const upiId = document.getElementById("upiId").value;
    const qrLink = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent("upi://pay?pa=" + upiId + "&pn=SecurePayment&cu=INR");
    document.getElementById("qrImage").src = qrLink;

    const particles = document.getElementById("particles");
    for (let i = 0; i < 28; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDelay = (Math.random() * 18) + "s";
      p.style.animationDuration = (12 + Math.random() * 12) + "s";
      p.style.opacity = Math.random() * 0.35;
      particles.appendChild(p);
    }
  </script>
</body>
</html>
